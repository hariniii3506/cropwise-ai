{% extends "base.html" %}

{% block title %}Set New Password - CROPWISE AI | புதிய கடவுச்சொல்{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-container">
    <!-- Left: Illustration Visual Side -->
    <div class="auth-visual-side">
      <img src="{{ url_for('static', filename='images/login-farmer.svg') }}" alt="Reset Password" class="auth-art-img">
    </div>

    <!-- Right: New Password Form Side -->
    <div class="auth-form-side">
      <h2 class="auth-heading" data-i18n="auth.reset_password_heading">Set New Password</h2>
      <div style="font-size: 1.1rem; font-weight: 700; color: var(--color-primary); margin-bottom: 6px; text-align: center;">புதிய கடவுச்சொல்லை அமைக்கவும்</div>
      <p class="auth-subtitle" data-i18n="auth.reset_password_subtitle">
        Create a new secure password for your farmer account.
      </p>

      <form action="{{ url_for('reset_password') }}" method="POST" id="resetPasswordForm">
        <!-- New Password with Eye Toggle -->
        <div class="form-group" style="position: relative; margin-bottom: 18px;">
          <label class="form-label" for="newPassword" data-i18n="auth.new_password">New Password</label>
          <input 
            type="password" 
            id="newPassword" 
            name="password" 
            class="form-control"
            placeholder="Create password (min 6 chars)" 
            data-i18n-placeholder="auth.new_password_placeholder"
            minlength="6" 
            required 
            autofocus
          >
          <span onclick="togglePasswordVisibility('newPassword', this)"
            style="position: absolute; right: 12px; bottom: 8px; cursor: pointer; font-size: 1.1rem; user-select: none;">👁️</span>
        </div>

        <!-- Confirm New Password with Eye Toggle -->
        <div class="form-group" style="position: relative; margin-bottom: 24px;">
          <label class="form-label" for="confirmPassword" data-i18n="auth.confirm_new_password">Confirm New Password</label>
          <input 
            type="password" 
            id="confirmPassword" 
            name="confirm_password" 
            class="form-control"
            placeholder="Re-enter new password" 
            data-i18n-placeholder="auth.confirm_new_password_placeholder"
            minlength="6" 
            required
          >
          <span onclick="togglePasswordVisibility('confirmPassword', this)"
            style="position: absolute; right: 12px; bottom: 8px; cursor: pointer; font-size: 1.1rem; user-select: none;">👁️</span>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 13px; font-size: 1rem; margin-bottom: 15px; font-weight: 700;" data-i18n="auth.btn_reset_password" id="btnResetSubmit">
          Reset Password
        </button>
      </form>

      <div class="auth-footer" style="margin-top: 15px;">
        <a href="{{ url_for('login') }}" style="font-weight: 700; color: var(--color-primary);" data-i18n="auth.back_to_login" id="linkBackToLogin">
          ← Back to Login
        </a>
      </div>
    </div>
  </div>
</div>

<script>
  function togglePasswordVisibility(inputId, iconElement) {
    const input = document.getElementById(inputId);
    if (!input) return;
    if (input.type === "password") {
      input.type = "text";
      iconElement.textContent = "🙈";
    } else {
      input.type = "password";
      iconElement.textContent = "👁️";
    }
  }

  // Client-side password match verification
  document.getElementById('resetPasswordForm')?.addEventListener('submit', function (e) {
    const pass = document.getElementById('newPassword').value;
    const confirmPass = document.getElementById('confirmPassword').value;
    const currentLang = typeof getCurrentLanguage === "function" ? getCurrentLanguage() : "en";

    if (pass !== confirmPass) {
      e.preventDefault();
      const msg = (currentLang === "ta")
        ? "புதிய கடவுச்சொல் மற்றும் உறுதிப்படுத்தல் கடவுச்சொல் இரண்டும் சரியாக பொருந்தவில்லை!"
        : "New Password and Confirm Password do not match. Please check and try again.";
      alert(msg);
      document.getElementById('confirmPassword').focus();
    }
  });
</script>
{% endblock %}
